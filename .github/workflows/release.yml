name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BackgroundImageRemover.slnx

      - name: Test
        run: dotnet test tests/BackgroundImageRemover.Tests/BackgroundImageRemover.Tests.csproj -c Release --no-restore

      - name: Publish self-contained single-file executable
        run: >
          dotnet publish src/BackgroundImageRemover/BackgroundImageRemover.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Publish framework-dependent single-file executable
        run: >
          dotnet publish src/BackgroundImageRemover/BackgroundImageRemover.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/framework-dependent

      - name: Rename executables
        shell: pwsh
        run: |
          Rename-Item `
            "publish/self-contained/BackgroundImageRemover.exe" `
            "publish/BackgroundImageRemover-win-x64.exe"

          Rename-Item `
            "publish/framework-dependent/BackgroundImageRemover.exe" `
            "publish/BackgroundImageRemover-win-x64-framework-dependent.exe"

      - name: Set release tag
        id: tag
        shell: bash
        run: echo "tag=$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            publish/BackgroundImageRemover-win-x64.exe \
            publish/BackgroundImageRemover-win-x64-framework-dependent.exe \
            --title "Build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated build from commit ${{ github.sha }}"
