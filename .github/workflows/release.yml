name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore BackgroundImageRemover.slnx

      - name: Build
        run: dotnet build BackgroundImageRemover.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/BackgroundImageRemover.Tests/BackgroundImageRemover.Tests.csproj -c Release --no-build

      - name: Publish self-contained
        run: >
          dotnet publish src/BackgroundImageRemover/BackgroundImageRemover.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Publish framework-dependent
        run: >
          dotnet publish src/BackgroundImageRemover/BackgroundImageRemover.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish/framework-dependent

      - name: Create release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/dist"

          Compress-Archive `
            -Path "publish/self-contained/*" `
            -DestinationPath "publish/dist/BackgroundImageRemover-win-x64-self-contained.zip" `
            -Force

          Compress-Archive `
            -Path "publish/framework-dependent/*" `
            -DestinationPath "publish/dist/BackgroundImageRemover-win-x64-framework-dependent.zip" `
            -Force

      - name: Set release tag
        id: tag
        shell: bash
        run: echo "tag=$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "publish/dist/BackgroundImageRemover-win-x64-self-contained.zip" \
            "publish/dist/BackgroundImageRemover-win-x64-framework-dependent.zip" \
            --title "Build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated build from commit ${{ github.sha }}"

